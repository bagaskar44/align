[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/domain", "services/api", "services/worker"]

[tool.uv.sources]
align-domain = { workspace = true }
align-api = { workspace = true }

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "openpyxl>=3.1.5,<4",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
  addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
  pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/domain/src", "services/api/src", "services/worker/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["packages/domain/src", "services/api/src", "services/worker/src"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["align_worker.tasks", "align_worker.celery_app"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["defusedxml", "defusedxml.*", "pypdf", "PIL", "PIL.*", "docx", "docx.*", "docling.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

