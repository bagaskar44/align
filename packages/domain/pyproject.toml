[project]
name = "align-domain"
version = "0.1.0"
description = "Shared ALIGN contracts and deterministic mock provider"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/align_domain"]

