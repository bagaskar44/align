[project]
name = "align-worker"
version = "0.1.0"
description = "ALIGN Celery workers and operational dispatchers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "align-api",
  "celery[redis]>=5.4,<6",
]

[project.optional-dependencies]
parser = [
  "docling-slim[format-pdf,models-local,feat-ocr-rapidocr,cli]>=2,<3",
  "pillow>=10,<13",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "torch>=2.2.2,<3; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchvision>=0,<1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/align_worker"]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

