name: align

services:
  postgres:
    image: pgvector/pgvector:pg17
    env_file: .env.postgres
    environment:
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
      OPERATOR_DB_PASSWORD: ${OPERATOR_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private]

  object-storage:
    # S3Mock is intentionally development/test-only. Production points to a private S3-compatible service.
    image: adobe/s3mock:5
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - object-storage-data:/s3mockroot
    restart: unless-stopped
    networks: [private]

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env.migration
    command: ["uv", "run", "--no-sync", "--package", "align-api", "align", "db", "upgrade"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [private]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env.api
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    command: ["uv", "run", "--no-sync", "--package", "align-api", "uvicorn", "align_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks: [private]

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env.worker
    environment:
      ALIGN_WORKER_QUEUE: ${REDIS_QUEUE_PREFIX}.general
    command: ["sh", "-lc", "uv run --no-sync --package align-worker celery -A align_worker.celery_app:celery_app worker --loglevel=INFO --concurrency=2 --queues=$${ALIGN_WORKER_QUEUE}"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [private]

  parser-worker:
    build:
      context: .
      dockerfile: docker/parser-worker.Dockerfile
    env_file: .env.worker
    environment:
      ALIGN_WORKER_QUEUE: ${REDIS_QUEUE_PREFIX}.parser
      PARSER_NODE_ID: ${PARSER_NODE_ID:-align-dev-node}
    command: ["sh", "-lc", "uv run --no-sync --package align-worker celery -A align_worker.celery_app:celery_app worker --loglevel=INFO --concurrency=1 --queues=$${ALIGN_WORKER_QUEUE}"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 9g
    cpus: 2.0
    pids_limit: 128
    stop_grace_period: 30s
    networks: [private]

  outbox-dispatcher:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env.worker
    command: ["uv", "run", "--no-sync", "--package", "align-worker", "python", "-m", "align_worker.dispatcher"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [private]

  scheduler:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env.worker
    command: ["uv", "run", "--no-sync", "--package", "align-worker", "celery", "-A", "align_worker.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [private]

  test-runner:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/test.Dockerfile
    env_file: .env.tests
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    command: ["uv", "run", "--no-sync", "pytest", "tests/integration"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [private]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks: [private]

  proxy:
    image: caddy:2.10.2-alpine
    ports:
      - "127.0.0.1:${ALIGN_HOST_PORT:-3000}:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge, private]

volumes:
  postgres-data:
  redis-data:
  object-storage-data:
  caddy-data:
  caddy-config:

networks:
  edge:
    driver: bridge
  private:
    internal: true

